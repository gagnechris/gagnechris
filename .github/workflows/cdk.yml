name: CDK

on:
  pull_request:
    branches: [main]
  # Deploy only after CI succeeds on main (not on push alone).
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # Nightly drift check (08:00 UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Job to run'
        type: choice
        options:
          - deploy
          - drift
        default: deploy

env:
  AWS_REGION: us-east-1
  # Placeholder for synth-only paths; real deploys use repo variable ALERTS_EMAIL.
  ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL || 'ci-placeholder@example.com' }}
  # Cognito admin-group member (CHR-195); empty → ALERTS_EMAIL.
  ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
  VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
  VITE_COGNITO_WEB_CLIENT_ID: ciplaceholderclientid00000000
  VITE_COGNITO_AUTH_DOMAIN: auth.example.com

jobs:
  diff:
    name: CDK diff (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: cdk-diff-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials (diff role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK synth
        run: npm run cdk -- synth --quiet

      # Live GSI guard: Compare APP_TABLE to DescribeTable so bumping
      # LAST_DEPLOYED_GSIS in the same PR cannot hide a multi-GSI change (CHR-174).
      - name: Assert GSI update vs deployed table
        run: npm run check:deployed-gsi

      - name: CDK diff
        id: cdk_diff
        run: |
          set +e
          npm run cdk -- diff --no-change-set 2>&1 | tee cdk-diff.txt
          code=${PIPESTATUS[0]}
          set -e
          # aws-cdk 2.x: exit 0 with or without diffs unless --fail is passed.
          # Any non-zero exit is a real error (role, lookup, synth) - fail the job.
          if [ "$code" -ne 0 ]; then
            {
              echo '## CDK diff failed'
              echo ''
              echo '```'
              head -c 60000 cdk-diff.txt
              echo ''
              echo '```'
            } > cdk-diff-comment.md
            exit "$code"
          fi
          {
            echo '## CDK diff'
            echo ''
            echo '```'
            # Keep the comment under GitHub's size limit.
            head -c 60000 cdk-diff.txt
            echo ''
            echo '```'
          } > cdk-diff-comment.md

      - name: Post diff comment
        if: ${{ !cancelled() && hashFiles('cdk-diff-comment.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: cdk-diff
          path: cdk-diff-comment.md

  # Single job for CDK + web so they cannot interleave across pushes
  # (GitHub keeps only one pending job per concurrency group).
  deploy:
    name: CDK + web deploy (main)
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: prod
    concurrency:
      group: cdk-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Deploy the commit CI validated (workflow_run), not a floating main tip.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Path filters and ancestry checks use ReadOnly creds only — third-party
      # actions must not run while the AdministratorAccess deploy role is loaded (CHR-176).
      # Drift role trusts `environment:prod` (diff role is PR-only).
      - name: Configure AWS credentials (planning role)
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Path filters compare against the last SHA that actually finished a
      # deploy (SSM deployed-sha), not HEAD~1. Otherwise an infra commit whose
      # CI was cancelled is invisible to a later docs-only push and never
      # deploys (CHR-149).
      - name: Resolve path-filter base
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        id: path_base
        run: |
          DEPLOYED_SHA_PARAM="$(bash scripts/ssm-param-name.sh prod deployedSha)"
          echo "DEPLOYED_SHA_PARAM=${DEPLOYED_SHA_PARAM}" >> "$GITHUB_ENV"
          set +e
          DEPLOYED=$(aws ssm get-parameter \
            --name "${DEPLOYED_SHA_PARAM}" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null)
          code=$?
          set -e
          HEAD="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          echo "head_sha=${HEAD}" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] || [ -z "$DEPLOYED" ] || [ "$DEPLOYED" = "None" ]; then
            echo "No deployed-sha in SSM; deploying everything."
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${DEPLOYED}^{commit}" 2>/dev/null; then
            echo "deployed-sha ${DEPLOYED} not in this clone; deploying everything."
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Path-filter base = last deployed SHA ${DEPLOYED}"
          echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          echo "sha=${DEPLOYED}" >> "$GITHUB_OUTPUT"

      - name: Refuse rollback deploy
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        run: |
          HEAD="${{ steps.path_base.outputs.head_sha }}"
          BASE="${{ steps.path_base.outputs.sha }}"
          if [ "${{ steps.path_base.outputs.deploy_all }}" = "true" ] || [ -z "$BASE" ]; then
            echo "Skipping ancestry check (no deployed base)."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BASE" "$HEAD"; then
            echo "Refusing deploy: ${HEAD} is not a descendant of deployed ${BASE}." >&2
            exit 1
          fi
          echo "Deploy head ${HEAD} descends from deployed ${BASE}."

      - name: Path filter
        if: github.event_name == 'workflow_run' && steps.path_base.outputs.deploy_all != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          base: ${{ steps.path_base.outputs.sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            cdk:
              - 'infra/**'
              - 'services/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - '.github/workflows/cdk.yml'
              - '.github/actions/setup/**'
            web:
              - 'apps/web/**'
              - 'packages/api-client/**'
              - 'packages/app-core/**'
              - 'packages/shared/**'
              - 'packages/tokens/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - 'scripts/deploy-web.sh'
              - '.github/workflows/cdk.yml'
              - '.github/actions/setup/**'

      - name: Configure AWS credentials (deploy role)
        if: >
          (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') &&
          (
            github.event_name == 'workflow_dispatch' ||
            steps.path_base.outputs.deploy_all == 'true' ||
            steps.filter.outputs.cdk == 'true' ||
            steps.filter.outputs.web == 'true'
          )
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.path_base.outputs.deploy_all == 'true' ||
          steps.filter.outputs.cdk == 'true' ||
          steps.filter.outputs.web == 'true'
        uses: ./.github/actions/setup

      - name: Require ALERTS_EMAIL
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.path_base.outputs.deploy_all == 'true' ||
          steps.filter.outputs.cdk == 'true'
        run: |
          if [ -z "${{ vars.ALERTS_EMAIL }}" ]; then
            echo "Set repository variable ALERTS_EMAIL before deploying."
            exit 1
          fi

      - name: CDK deploy
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.path_base.outputs.deploy_all == 'true' ||
          steps.filter.outputs.cdk == 'true'
        env:
          ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }}
        run: npm run cdk -- deploy --all --require-approval never

      # Scratch PITR restore + Scan COUNT compare (CHR-175). Runs after Data
      # deploys so Backup/PITR stay proven; does not rename gagnechris-prod.
      - name: PITR restore rehearsal
        if: >
          success() && (
            github.event_name == 'workflow_dispatch' ||
            steps.path_base.outputs.deploy_all == 'true' ||
            steps.filter.outputs.cdk == 'true'
          )
        run: |
          chmod +x scripts/rehearse-pitr-restore.sh
          scripts/rehearse-pitr-restore.sh | tee pitr-rehearsal.log
          # Surface for the Actions summary / RUNBOOK paste.
          grep '^REHEARSAL_OK' pitr-rehearsal.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload PITR rehearsal log
        if: >
          always() && (
            github.event_name == 'workflow_dispatch' ||
            steps.path_base.outputs.deploy_all == 'true' ||
            steps.filter.outputs.cdk == 'true'
          )
        uses: actions/upload-artifact@v4
        with:
          name: pitr-rehearsal-log
          path: pitr-rehearsal.log
          if-no-files-found: ignore

      - name: Build, sync to S3, invalidate CloudFront
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.path_base.outputs.deploy_all == 'true' ||
          steps.filter.outputs.web == 'true' ||
          steps.filter.outputs.cdk == 'true'
        run: bash scripts/deploy-web.sh
        env:
          ENV_NAME: prod

      - name: Record deployed SHA
        if: >
          success() && (
            github.event_name == 'workflow_dispatch' ||
            steps.path_base.outputs.deploy_all == 'true' ||
            steps.filter.outputs.cdk == 'true' ||
            steps.filter.outputs.web == 'true'
          )
        run: |
          SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          aws ssm put-parameter \
            --name "${DEPLOYED_SHA_PARAM}" \
            --type String \
            --value "$SHA" \
            --overwrite
          echo "Recorded deployed-sha=${SHA}"

  drift:
    name: CDK drift
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'drift')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: prod
    concurrency:
      # Separate from deploy so nightly drift never queues behind or blocks deploy (CHR-176).
      group: cdk-drift
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials (drift role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK drift
        id: drift
        env:
          ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }}
        run: |
          set +e
          npm run cdk -- drift --fail 2>&1 | tee cdk-drift.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "Drift detected or drift command failed."
            exit "$code"
          fi

      - name: Notify SNS on failure
        if: failure()
        env:
          ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }}
        run: |
          ALERTS_TOPIC_PARAM="$(bash scripts/ssm-param-name.sh prod alertsTopicArn)"
          TOPIC_ARN=$(aws ssm get-parameter \
            --name "${ALERTS_TOPIC_PARAM}" \
            --query 'Parameter.Value' \
            --output text)
          aws sns publish \
            --topic-arn "$TOPIC_ARN" \
            --subject "gagnechris CDK drift detected" \
            --message "Nightly/manual cdk drift failed on ${GITHUB_SHA}. See Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
