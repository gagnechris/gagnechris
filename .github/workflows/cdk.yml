name: CDK

on:
  pull_request:
    branches: [main]
  # Deploy only after CI succeeds on main (not on push alone).
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Job to run'
        type: choice
        options:
          - deploy
          - drift
        default: deploy

permissions:
  contents: read

# An explicit bash shell runs with -eo pipefail, so `script | tee` fails when
# the script does.
defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-1
  # Placeholder for synth-only paths; real deploys use repo variable ALERTS_EMAIL.
  ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL || 'ci-placeholder@example.com' }}
  # Cognito admin-group member; empty falls back to ALERTS_EMAIL.
  ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
  VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
  VITE_COGNITO_ADMIN_CLIENT_ID: ciplaceholderadminclient000000
  VITE_COGNITO_NOTEBOOK_CLIENT_ID: ciplaceholdernotebookclient000
  VITE_COGNITO_AUTH_DOMAIN: auth.example.com

jobs:
  diff:
    name: CDK diff (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: cdk-diff-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # id-token is job-wide, so install scripts stay off.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
          go-cache: 'false'

      - name: Configure AWS credentials (diff role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK synth
        run: npm run cdk -- synth --quiet

      # Compares against the live table so bumping LAST_DEPLOYED_GSIS in the
      # same PR cannot hide a multi-GSI change. Early warning only: the deploy
      # job runs the same check.
      - name: Assert GSI update vs deployed table
        run: npm run check:deployed-gsi

      - name: CDK diff
        id: cdk_diff
        run: |
          set +e
          npm run cdk -- diff --no-change-set 2>&1 | tee cdk-diff.txt
          code=${PIPESTATUS[0]}
          set -e
          comment() {
            {
              echo "## $1"
              echo ''
              echo '```'
              # Keep the comment under GitHub's size limit.
              head -c 60000 cdk-diff.txt
              echo ''
              echo '```'
            } > cdk-diff-comment.md
          }
          # aws-cdk 2.x: exit 0 with or without diffs unless --fail is passed.
          # Any non-zero exit is a real error (role, lookup, synth) - fail the job.
          if [ "$code" -ne 0 ]; then
            comment 'CDK diff failed'
            exit "$code"
          fi
          comment 'CDK diff'

      - name: Post diff comment
        if: ${{ !cancelled() && hashFiles('cdk-diff-comment.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cdk-diff
          path: cdk-diff-comment.md

  # `id-token: write` is job-wide and the deploy and drift roles both trust
  # `environment:prod`, so no job with it may run install scripts or a
  # tag-pinned / third-party action. plan therefore runs no npm at all.
  # plan and deploy share `cdk-prod` so a plan never reads deployed-sha while
  # another run's deploy is in flight.
  plan:
    name: Plan deploy (main)
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # Planning (drift) role trusts `environment:prod`.
    environment: prod
    concurrency:
      group: cdk-prod
      cancel-in-progress: false
    outputs:
      head_sha: ${{ steps.base.outputs.head_sha }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      cdk: ${{ steps.filter.outputs.cdk }}
      web: ${{ steps.filter.outputs.web }}
      components: ${{ steps.filter.outputs.components }}
      VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_ADMIN_CLIENT_ID: ${{ steps.cognito.outputs.VITE_COGNITO_ADMIN_CLIENT_ID }}
      VITE_COGNITO_NOTEBOOK_CLIENT_ID: ${{ steps.cognito.outputs.VITE_COGNITO_NOTEBOOK_CLIENT_ID }}
      VITE_COGNITO_AUTH_DOMAIN: ${{ steps.cognito.outputs.VITE_COGNITO_AUTH_DOMAIN }}
    steps:
      # Every job checks out github.sha, fixed for the run. For workflow_run it
      # is main's tip when CI finished, so the superseded check below deploys
      # it only when it is the commit CI validated.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS credentials (planning role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Diff against the last SHA that finished a deploy, not HEAD~1, so an
      # infra commit whose CI was cancelled is not skipped by a later push.
      - name: Resolve deployed SHA
        id: base
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE="$(bash scripts/ci/read-deployed-sha.sh prod)"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Deploy head ${HEAD_SHA}; last deployed ${BASE:-(none)}"

      - name: Refuse a head off main or a rollback deploy
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
          HEAD_SHA: ${{ steps.base.outputs.head_sha }}
        run: bash scripts/ci/check-deploy-ancestry.sh "${BASE}" "${HEAD_SHA}"

      # main moved on after CI finished: the newer commit's own CI run
      # triggers the deploy that includes this one.
      - name: Path filter
        id: filter
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
          HEAD_SHA: ${{ steps.base.outputs.head_sha }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_run' ] && [ "${VALIDATED_SHA}" != "${HEAD_SHA}" ]; then
            echo "Superseded: CI validated ${VALIDATED_SHA}, main is now ${HEAD_SHA}. Not deploying."
            printf 'cdk=false\nweb=false\ncomponents=false\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ] || [ -z "${BASE}" ]; then
            echo "Manual deploy or no deployed-sha: deploying everything."
            printf 'cdk=true\nweb=true\ncomponents=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/ci/deploy-paths.sh "${BASE}" "${HEAD_SHA}" | tee -a "$GITHUB_OUTPUT"

      # The web build runs in a job with no AWS access, so the Cognito
      # settings it bakes in are read here.
      - name: Read the web build's Cognito settings
        id: cognito
        env:
          ENV_NAME: prod
        run: bash scripts/deploy-web.sh cognito-env | tee -a "$GITHUB_OUTPUT"

  # Vite, Storybook and their plugins run here, in a job that can mint no OIDC
  # token and reads no secret. deploy only uploads what this job built.
  build:
    name: Build web and catalog (main)
    needs: plan
    if: needs.plan.outputs.web == 'true' || needs.plan.outputs.components == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
          go: 'false'

      - name: Build web
        if: needs.plan.outputs.web == 'true'
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ needs.plan.outputs.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_ADMIN_CLIENT_ID: ${{ needs.plan.outputs.VITE_COGNITO_ADMIN_CLIENT_ID }}
          VITE_COGNITO_NOTEBOOK_CLIENT_ID: ${{ needs.plan.outputs.VITE_COGNITO_NOTEBOOK_CLIENT_ID }}
          VITE_COGNITO_AUTH_DOMAIN: ${{ needs.plan.outputs.VITE_COGNITO_AUTH_DOMAIN }}
        run: bash scripts/deploy-web.sh build

      # .well-known holds the Apple and WebAuthn association files.
      - name: Upload web build
        if: needs.plan.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: |
            apps/web/dist
            apps/web/dist-admin
            apps/web/dist-notebook
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Build the component catalog
        if: needs.plan.outputs.components == 'true'
        run: bash scripts/deploy-components.sh build

      - name: Upload the component catalog
        if: needs.plan.outputs.components == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: components-dist
          path: apps/storybook/storybook-static
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: CDK + web deploy (main)
    needs: [plan, build]
    # build is skipped for a CDK-only deploy.
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.plan.outputs.cdk == 'true' || needs.plan.outputs.web == 'true' || needs.plan.outputs.components == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: prod
    # Single job for CDK + web so they cannot interleave across pushes
    # (GitHub keeps only one pending job per concurrency group).
    concurrency:
      group: cdk-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the planned commit
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "${HEAD_SHA}" ]; then
            echo "Refusing deploy: checked out $(git rev-parse HEAD), plan approved ${HEAD_SHA}." >&2
            exit 1
          fi

      # Install before any credential step, with install scripts off and no Go
      # cache. esbuild gets its platform binary from optionalDependencies, so
      # synth bundles without postinstall.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
          go-cache: 'false'

      - name: Require ALERTS_EMAIL
        if: needs.plan.outputs.cdk == 'true'
        run: |
          if [ -z "${{ vars.ALERTS_EMAIL }}" ]; then
            echo "Set repository variable ALERTS_EMAIL before deploying."
            exit 1
          fi

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Plan and deploy share `cdk-prod`, so this should never trip. It keeps
      # the rollback check honest if the parameter moved between the jobs.
      - name: Confirm deployed SHA unchanged since plan
        env:
          PLANNED_BASE: ${{ needs.plan.outputs.base_sha }}
        run: |
          CURRENT="$(bash scripts/ci/read-deployed-sha.sh prod)"
          if [ "${CURRENT}" != "${PLANNED_BASE}" ]; then
            echo "Refusing deploy: deployed-sha is now '${CURRENT}', plan saw '${PLANNED_BASE}'. Re-run the deploy." >&2
            exit 1
          fi

      # CloudFormation rejects more than one GSI change per update; compare
      # against the live table since LAST_DEPLOYED_GSIS can be bumped in the PR.
      - name: Assert GSI update vs deployed table
        if: needs.plan.outputs.cdk == 'true'
        run: npm run check:deployed-gsi

      - name: CDK deploy
        if: needs.plan.outputs.cdk == 'true'
        env:
          ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }}
        run: npm run cdk -- deploy --all --require-approval never

      - name: Download web build
        if: needs.plan.outputs.web == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web

      - name: Sync web to S3, invalidate CloudFront
        if: needs.plan.outputs.web == 'true'
        run: bash scripts/deploy-web.sh upload
        env:
          ENV_NAME: prod
          VITE_COGNITO_USER_POOL_ID: ${{ needs.plan.outputs.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_ADMIN_CLIENT_ID: ${{ needs.plan.outputs.VITE_COGNITO_ADMIN_CLIENT_ID }}
          VITE_COGNITO_NOTEBOOK_CLIENT_ID: ${{ needs.plan.outputs.VITE_COGNITO_NOTEBOOK_CLIENT_ID }}
          VITE_COGNITO_AUTH_DOMAIN: ${{ needs.plan.outputs.VITE_COGNITO_AUTH_DOMAIN }}

      - name: Download the component catalog
        if: needs.plan.outputs.components == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: components-dist
          path: apps/storybook/storybook-static

      - name: Publish the component catalog
        if: needs.plan.outputs.components == 'true'
        run: bash scripts/deploy-components.sh upload
        env:
          ENV_NAME: prod

      - name: Record deployed SHA
        if: success()
        env:
          SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          DEPLOYED_SHA_PARAM="$(bash scripts/ssm-param-name.sh prod deployedSha)"
          aws ssm put-parameter \
            --name "${DEPLOYED_SHA_PARAM}" \
            --type String \
            --value "$SHA" \
            --overwrite
          echo "Recorded deployed-sha=${SHA}"

  drift:
    name: CDK drift
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'drift')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: prod
    concurrency:
      # Separate from cdk-prod: in a shared group a queued drift run would
      # cancel a pending deploy. Overlap is detected in the steps instead.
      group: cdk-drift
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # environment:prod + id-token is also trusted by the deploy role.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
          go-cache: 'false'

      - name: Configure AWS credentials (drift role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # A deploy mid-update would make drift detection fail or report
      # half-applied state. Skip (no alert) while any prod stack is updating.
      - name: Check for a deploy in progress
        id: before
        run: |
          echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          set +e
          bash scripts/ci/prod-stack-activity.sh
          code=$?
          set -e
          case "$code" in
            0) echo "busy=false" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "::warning::Prod stacks are updating; skipping drift this run."
              echo "busy=true" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$code" ;;
          esac

      - name: CDK drift
        id: drift
        if: steps.before.outputs.busy == 'false'
        env:
          ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }}
        run: |
          set +e
          npm run cdk -- drift --fail 2>&1 | tee cdk-drift.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      # If a deploy touched any prod stack while drift ran, the result is not
      # trustworthy either way: warn instead of alerting.
      - name: Evaluate drift
        if: steps.before.outputs.busy == 'false'
        env:
          DRIFT_EXIT: ${{ steps.drift.outputs.exit_code }}
          STARTED: ${{ steps.before.outputs.started }}
        run: |
          if [ "$DRIFT_EXIT" = "0" ]; then
            echo "No drift."
            exit 0
          fi
          set +e
          bash scripts/ci/prod-stack-activity.sh "$STARTED"
          code=$?
          set -e
          case "$code" in
            0)
              echo "Drift detected or drift command failed (exit ${DRIFT_EXIT})."
              exit 1
              ;;
            3)
              echo "::warning::A deploy changed prod stacks during drift; result discarded."
              exit 0
              ;;
            *) exit "$code" ;;
          esac

      - name: Notify SNS on failure
        if: failure()
        run: |
          bash scripts/ci/notify-alerts.sh \
            "gagnechris CDK drift detected" \
            "Nightly/manual cdk drift failed on ${GITHUB_SHA}. See Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
