name: iOS release

# A tag `ios-vX.Y.Z` on main builds the app on this runner and submits it to
# TestFlight. A manual run must pick such a tag as its ref.
# `eas build --local` keeps builds off the EAS cloud quota while EAS still
# holds the signing credentials, the build number (`autoIncrement`) and the
# App Store Connect API key, so the workflow only holds the Expo token.
# The local build runs dependency install scripts and `pod install`, so it runs
# without the token (scripts/ci/eas-local-build.sh), after the last step that
# has it, and the submit runs in a fresh job.
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require an ios-v* tag on main
        run: bash scripts/ci/check-release-ref.sh "${GITHUB_REF}" "${GITHUB_SHA}"

      # Non-interactive submit needs the App Store Connect app id.
      - name: Require the App Store Connect app id
        working-directory: apps/mobile
        run: |
          node -e '
            const id = require("./eas.json").submit?.production?.ios?.ascAppId;
            if (!/^\d+$/.test(id ?? "")) {
              console.error("Set submit.production.ios.ascAppId in apps/mobile/eas.json (infra/RUNBOOK.md, iOS release).");
              process.exit(1);
            }'

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
          npm-cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
          go: 'false'

      - name: Install mobile
        working-directory: apps/mobile
        run: npm ci --ignore-scripts

      - name: Typecheck, lint, test and check the bundle
        run: bash scripts/ci/mobile-checks.sh

      - name: Install EAS CLI
        run: npm install --global --ignore-scripts eas-cli@24.7.0

      - name: Prepare the build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash ../../scripts/ci/eas-local-build.sh prepare "${RUNNER_TEMP}/eas-local-build"

      - name: Build
        working-directory: apps/mobile
        run: >-
          bash ../../scripts/ci/eas-local-build.sh build
          "${RUNNER_TEMP}/eas-local-build" "${RUNNER_TEMP}/app.ipa"

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-ipa
          path: ${{ runner.temp }}/app.ipa
          if-no-files-found: error
          retention-days: 1

  submit:
    name: Submit to TestFlight
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testflight
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # eas-cli reads the app config, which loads the config plugins.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
          npm-cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
          go: 'false'

      - name: Install mobile
        working-directory: apps/mobile
        run: npm ci --ignore-scripts

      - name: Install EAS CLI
        run: npm install --global --ignore-scripts eas-cli@24.7.0

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-ipa
          path: ${{ runner.temp }}

      - name: Submit to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas submit --platform ios --profile production
          --non-interactive --path "${RUNNER_TEMP}/app.ipa"
