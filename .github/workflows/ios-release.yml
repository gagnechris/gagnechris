name: iOS release

# A tag `ios-vX.Y.Z` on main builds the app on this runner and submits it to
# TestFlight. A manual run must pick such a tag as its ref.
# `eas build --local` keeps builds off the EAS cloud quota while EAS still
# holds the signing credentials, the build number (`autoIncrement`) and the
# App Store Connect API key, so this job only holds the Expo token.
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and submit to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require an ios-v* tag on main
        run: bash scripts/ci/check-release-ref.sh "${GITHUB_REF}" "${GITHUB_SHA}"

      # Non-interactive submit needs the App Store Connect app id.
      - name: Require the App Store Connect app id
        working-directory: apps/mobile
        run: |
          node -e '
            const id = require("./eas.json").submit?.production?.ios?.ascAppId;
            if (!/^\d+$/.test(id ?? "")) {
              console.error("Set submit.production.ios.ascAppId in apps/mobile/eas.json (infra/RUNBOOK.md, iOS release).");
              process.exit(1);
            }'

      # This job holds EXPO_TOKEN.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
          npm-cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
          go: 'false'

      - name: Install mobile
        working-directory: apps/mobile
        run: npm ci --ignore-scripts

      - name: Typecheck, lint, test and check the bundle
        run: bash scripts/ci/mobile-checks.sh

      - name: Install EAS CLI
        run: npm install --global --ignore-scripts eas-cli@24.7.0

      - name: Build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas build --local --platform ios --profile production
          --non-interactive --output "${RUNNER_TEMP}/app.ipa"

      - name: Submit to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas submit --platform ios --profile production
          --non-interactive --path "${RUNNER_TEMP}/app.ipa"
