# Manual PITR restore rehearsal into a scratch table (CHR-175).
# Does not rename or delete gagnechris-prod.
name: PITR restore rehearsal

on:
  workflow_dispatch:
    inputs:
      keep_target:
        description: 'Leave the restored scratch table (1) or delete it (0)'
        type: choice
        options:
          - '0'
          - '1'
        default: '0'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  rehearse:
    name: Restore scratch table and compare counts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rehearse PITR restore
        env:
          KEEP_TARGET: ${{ inputs.keep_target }}
        run: |
          chmod +x scripts/rehearse-pitr-restore.sh
          scripts/rehearse-pitr-restore.sh | tee pitr-rehearsal.log

      - name: Upload rehearsal log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pitr-rehearsal-log
          path: pitr-rehearsal.log
