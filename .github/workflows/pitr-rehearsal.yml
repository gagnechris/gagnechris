# Manual PITR restore rehearsal into a tagged scratch table (CHR-175 / CHR-198).
# Not part of any deploy. Does not rename or delete gagnechris-prod; the script
# deletes the scratch table on every exit unless keep_target=1.
name: PITR restore rehearsal

on:
  workflow_dispatch:
    inputs:
      keep_target:
        description: 'Leave the restored scratch table (1) or delete it (0). A kept table alarms after 24 h.'
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      force_failure:
        description: 'Fail after verification (1) to prove the scratch table is still deleted'
        type: choice
        options:
          - '0'
          - '1'
        default: '0'

permissions:
  id-token: write
  contents: read

# One rehearsal at a time; never cancel one mid-run (its cleanup must finish).
concurrency:
  group: pitr-rehearsal
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  rehearse:
    name: Restore scratch table and verify sampled rows
    runs-on: ubuntu-latest
    # Restore (≤45 min) + cleanup wait; the trap deletes the table on failure.
    timeout-minutes: 90
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rehearse PITR restore
        env:
          KEEP_TARGET: ${{ inputs.keep_target }}
          FORCE_FAIL: ${{ inputs.force_failure }}
        run: |
          set -o pipefail
          chmod +x scripts/rehearse-pitr-restore.sh
          scripts/rehearse-pitr-restore.sh 2>&1 | tee pitr-rehearsal.log
          grep -E '^REHEARSAL_(OK|FAILED)' pitr-rehearsal.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Summarise failure
        if: failure()
        run: grep -E '^REHEARSAL_(OK|FAILED)' pitr-rehearsal.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload rehearsal log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pitr-rehearsal-log
          path: pitr-rehearsal.log
          if-no-files-found: ignore
