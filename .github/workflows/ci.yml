name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared Vite placeholders for CI builds (not deployed from this workflow).
env:
  VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
  VITE_COGNITO_WEB_CLIENT_ID: ciplaceholderclientid00000000
  VITE_COGNITO_AUTH_DOMAIN: auth.example.com

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: OpenAPI contract drift
        run: npm run openapi:check

      # Root scripts delegate into workspaces. The site lives in apps/web.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: us-east-1
          ALERTS_EMAIL: ci-placeholder@example.com
        run: npm run cdk -- synth --quiet

      - name: Build
        run: npm run build

      - name: Reject VITE_AUTH_MODE=local in production build
        run: |
          if VITE_AUTH_MODE=local npm run build -w @gagnechris/web; then
            echo "Expected vite build to fail when VITE_AUTH_MODE=local" >&2
            exit 1
          fi

  local-e2e:
    name: Local E2E smoke (CHR-82)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'services/api/**'
              - 'services/publisher/**'
              - 'packages/shared/**'
              - 'packages/data/**'
              - 'scripts/local/**'
              - 'docker-compose.local.yml'
              - 'infra/lib/cloudfront/viewer-request-function.js'
              - 'infra/lib/cloudfront/viewer-response-function.js'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'

      - name: Setup
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        uses: ./.github/actions/setup

      - name: Build web shell
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: npm run build

      - name: Run e2e:local
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: npm run e2e:local
