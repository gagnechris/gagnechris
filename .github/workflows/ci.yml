name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root scripts delegate into workspaces. The site lives in apps/web.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-east-1
          ALERTS_EMAIL: ci-placeholder@example.com
        run: npm run cdk -- synth --quiet

      - name: Build
        env:
          # Placeholder Cognito config so Vite can bake env (not deployed from CI).
          VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
          VITE_COGNITO_WEB_CLIENT_ID: ciplaceholderclientid00000000
          VITE_COGNITO_AUTH_DOMAIN: auth.example.com
        run: npm run build

      - name: Reject VITE_AUTH_MODE=local in production build
        run: |
          if VITE_AUTH_MODE=local \
            VITE_COGNITO_USER_POOL_ID=us-east-1_ciPlaceholder \
            VITE_COGNITO_WEB_CLIENT_ID=ciplaceholderclientid00000000 \
            VITE_COGNITO_AUTH_DOMAIN=auth.example.com \
            npm run build -w @gagnechris/web; then
            echo "Expected vite build to fail when VITE_AUTH_MODE=local" >&2
            exit 1
          fi

  local-e2e:
    name: Local E2E smoke (CHR-82)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether local E2E paths changed
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(services/api/|services/publisher/|packages/shared/|scripts/local/|docker-compose\.local\.yml|infra/lib/cloudfront/viewer-request-function\.js|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping local E2E (no relevant path changes)"
          fi

      - name: Setup Node.js
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: npm ci

      - name: Build web shell
        if: steps.filter.outputs.run == 'true'
        env:
          VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
          VITE_COGNITO_WEB_CLIENT_ID: ciplaceholderclientid00000000
          VITE_COGNITO_AUTH_DOMAIN: auth.example.com
        run: npm run build

      - name: Run e2e:local
        if: steps.filter.outputs.run == 'true'
        run: npm run e2e:local
