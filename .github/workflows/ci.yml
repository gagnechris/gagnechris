name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root scripts delegate into workspaces. The site lives in apps/web.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-east-1
          ALERTS_EMAIL: ci-placeholder@example.com
        run: npm run cdk -- synth --quiet

      - name: Build
        env:
          # Placeholder Cognito config so Vite can bake env (not deployed from CI).
          VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
          VITE_COGNITO_WEB_CLIENT_ID: ciplaceholderclientid00000000
          VITE_COGNITO_AUTH_DOMAIN: auth.example.com
        run: npm run build
