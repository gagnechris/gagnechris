name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel main: a cancelled CI never triggers the CDK deploy, so that
  # commit's infra/web changes would be skipped.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Placeholders only; nothing is deployed from this workflow.
env:
  VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
  VITE_COGNITO_ADMIN_CLIENT_ID: ciplaceholderadminclient000000
  VITE_COGNITO_NOTEBOOK_CLIENT_ID: ciplaceholdernotebookclient000
  VITE_COGNITO_AUTH_DOMAIN: auth.example.com

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: OpenAPI contract drift
        run: npm run openapi:check

      - name: Go contract drift
        run: npm run go:generate:check

      - name: Design token CSS drift
        run: npm run tokens:check
      - name: Publish surface drift
        run: npm run publish-surface:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Go lint
        run: npm run go:lint

      - name: RN-facing package bundle guard
        run: npm run check:rn-bundles

      - name: Platform-neutral lint bans
        run: npm run check:platform-neutral-lint
      - name: TypeScript project coverage
        run: npm run check:tsconfig-coverage
      - name: Paths that differ only by case
        run: npm run check:case-collisions

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Go test
        run: npm run go:test

      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: us-east-1
          ALERTS_EMAIL: ci-placeholder@example.com
        run: npm run cdk -- synth --quiet

      - name: Build
        run: npm run build

      # The public build's bundle-boundary plugin already failed above if any
      # admin, Notebook or auth module reached it.
      - name: Web shell guard
        run: npm run check:web-shells

      - name: Reject VITE_AUTH_MODE=local in production build
        run: |
          if VITE_AUTH_MODE=local npm run build -w @gagnechris/web; then
            echo "Expected vite build to fail when VITE_AUTH_MODE=local" >&2
            exit 1
          fi

      - name: Public build with a GA measurement ID
        env:
          GA_MEASUREMENT_ID: G-CIPLACEHOLDER
        run: npm run build:public -w @gagnechris/web && npm run check:web-shells

  api-integration:
    name: API integration (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'packages/data/**'
              - 'packages/shared/**'
              - 'go/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - 'scripts/local/**'
              - 'docker-compose.local.yml'
              - 'docker-compose.ci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'

      - name: Setup
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        uses: ./.github/actions/setup

      - name: DynamoDB Local
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        env:
          COMPOSE_PROJECT_NAME: gagnechris-ci
        run: docker compose -f docker-compose.local.yml -f docker-compose.ci.yml up -d dynamodb

      - name: Wait for DynamoDB Local
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        run: npx tsx scripts/local/wait-dynamodb.ts http://127.0.0.1:8001

      - name: API integration tests
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:8001
          COMPOSE_PROJECT_NAME: gagnechris-ci
          SKIP_DYNAMODB_INTEGRATION_SETUP: '1'
        run: npm run test:integration -w @gagnechris/api

      - name: API HTTP suite against the Go API
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:8001
          COMPOSE_PROJECT_NAME: gagnechris-ci
          SKIP_DYNAMODB_INTEGRATION_SETUP: '1'
          API_SERVER_COMMAND: node --import tsx services/api/local/go-api.ts test
        run: npm run test:http -w @gagnechris/api

      - name: Stop CI DynamoDB Local
        if: always() && (github.event_name == 'push' || steps.filter.outputs.api == 'true')
        env:
          COMPOSE_PROJECT_NAME: gagnechris-ci
        run: docker compose -f docker-compose.local.yml -f docker-compose.ci.yml down

  local-e2e:
    name: Local E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/web/**'
              - 'services/api/**'
              - 'services/publisher/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - 'scripts/local/**'
              - 'e2e/**'
              - 'docker-compose.local.yml'
              - 'infra/lib/cloudfront/viewer-request-function.js'
              - 'infra/lib/cloudfront/viewer-response-function.js'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'

      - name: Setup
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        uses: ./.github/actions/setup

      - name: Build web shell
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: npm run build

      - name: Playwright version
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The Azure apt mirror is sometimes slow enough to eat the job timeout,
      # so the browsers' system packages are cached and handed to apt.
      - name: Cache Playwright system packages
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: playwright-debs-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}

      - name: Seed apt with cached packages
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi

      - name: Install Playwright browsers
        if: (github.event_name == 'push' || steps.filter.outputs.e2e == 'true') && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps
        if: (github.event_name == 'push' || steps.filter.outputs.e2e == 'true') && steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Keep apt packages for the cache
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: |
          mkdir -p "$HOME/apt-debs"
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/"
          fi

      - name: Run e2e:browser
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: npm run e2e:browser

      - name: Upload Playwright report
        if: failure() && (github.event_name == 'push' || steps.filter.outputs.e2e == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.stack/*/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
