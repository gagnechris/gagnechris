name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel main: a cancelled CI never triggers the CDK deploy, so that
  # commit's infra/web changes would be skipped.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Placeholders only; nothing is deployed from this workflow.
env:
  VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
  VITE_COGNITO_WEB_CLIENT_ID: ciplaceholderclientid00000000
  VITE_COGNITO_AUTH_DOMAIN: auth.example.com

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: OpenAPI contract drift
        run: npm run openapi:check

      - name: Design token CSS drift
        run: npm run tokens:check
      - name: Publish surface drift
        run: npm run publish-surface:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: RN-facing package bundle guard
        run: npm run check:rn-bundles

      - name: Platform-neutral lint bans
        run: npm run check:platform-neutral-lint
      - name: TypeScript project coverage
        run: npm run check:tsconfig-coverage

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: us-east-1
          ALERTS_EMAIL: ci-placeholder@example.com
        run: npm run cdk -- synth --quiet

      - name: Build
        run: npm run build

      - name: Reject VITE_AUTH_MODE=local in production build
        run: |
          if VITE_AUTH_MODE=local npm run build -w @gagnechris/web; then
            echo "Expected vite build to fail when VITE_AUTH_MODE=local" >&2
            exit 1
          fi

  api-integration:
    name: API integration (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'packages/data/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - 'scripts/local/**'
              - 'docker-compose.local.yml'
              - 'docker-compose.ci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'

      - name: Setup
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        uses: ./.github/actions/setup

      - name: DynamoDB Local
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        env:
          COMPOSE_PROJECT_NAME: gagnechris-ci
        run: docker compose -f docker-compose.local.yml -f docker-compose.ci.yml up -d dynamodb

      - name: Wait for DynamoDB Local
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:8001
        run: |
          for i in $(seq 1 60); do
            if node -e "
              import { DynamoDBClient, ListTablesCommand } from '@aws-sdk/client-dynamodb';
              const c = new DynamoDBClient({
                region: 'us-east-1',
                endpoint: 'http://127.0.0.1:8001',
                credentials: { accessKeyId: 'local', secretAccessKey: 'local' },
              });
              await c.send(new ListTablesCommand({}));
            " 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "DynamoDB Local did not become ready on :8001" >&2
          exit 1

      - name: API integration tests
        if: github.event_name == 'push' || steps.filter.outputs.api == 'true'
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:8001
          COMPOSE_PROJECT_NAME: gagnechris-ci
          SKIP_DYNAMODB_INTEGRATION_SETUP: '1'
        run: npm run test:integration -w @gagnechris/api

      - name: Stop CI DynamoDB Local
        if: always() && (github.event_name == 'push' || steps.filter.outputs.api == 'true')
        env:
          COMPOSE_PROJECT_NAME: gagnechris-ci
        run: docker compose -f docker-compose.local.yml -f docker-compose.ci.yml down

  local-e2e:
    name: Local E2E smoke (CHR-82)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/web/**'
              - 'services/api/**'
              - 'services/publisher/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - 'scripts/local/**'
              - 'docker-compose.local.yml'
              - 'infra/lib/cloudfront/viewer-request-function.js'
              - 'infra/lib/cloudfront/viewer-response-function.js'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'

      - name: Setup
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        uses: ./.github/actions/setup

      - name: Build web shell
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: npm run build

      - name: Run e2e:local
        if: github.event_name == 'push' || steps.filter.outputs.e2e == 'true'
        run: npm run e2e:local
