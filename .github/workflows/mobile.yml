name: Mobile

# No workflow-level `paths:`: "Mobile typecheck, lint, test, bundle" is a
# required check, so the job must always report. Path filtering happens
# inside the job, like ci.yml (CHR-199).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No AWS credentials — typecheck/lint/test/bundle only (CHR-142).
jobs:
  mobile:
    name: Mobile typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'packages/api-client/**'
              - 'packages/tokens/**'
              - 'packages/app-core/**'
              - 'eslint.config.js'
              - 'tsconfig.base.json'
              - '.github/workflows/mobile.yml'
              - '.github/actions/setup/**'
              - 'package-lock.json'

      # Root install: the shared packages plus eslint/prettier. It no longer
      # carries Expo or React Native (CHR-150).
      - name: Setup
        if: steps.filter.outputs.mobile == 'true'
        uses: ./.github/actions/setup

      # apps/mobile is outside the root workspaces and has its own lockfile, so
      # only this job pays for the Expo / RN tree.
      - name: Install mobile
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile + client packages
        if: steps.filter.outputs.mobile == 'true'
        run: |
          npm run typecheck -w @gagnechris/shared
          npm run typecheck -w @gagnechris/api-client
          npm run typecheck -w @gagnechris/tokens
          npm run typecheck -w @gagnechris/app-core
          npm run typecheck --prefix apps/mobile

      - name: Lint mobile
        if: steps.filter.outputs.mobile == 'true'
        run: npm run lint --prefix apps/mobile

      - name: Test mobile + client packages
        if: steps.filter.outputs.mobile == 'true'
        run: |
          npm test -w @gagnechris/api-client
          npm test -w @gagnechris/tokens
          npm test -w @gagnechris/app-core
          npm test --prefix apps/mobile

      # `expo export` succeeding proves nothing on its own: the CHR-142 spike
      # bundled `zod`'s `.d.ts` files and the app crashed on launch. Check the
      # sourcemap, then execute a bundle that evaluates shared Zod schemas.
      - name: Export iOS bundle
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm run export:ios

      - name: Reject type-only sources in the bundle
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm run check:bundle

      - name: Smoke-run shared Zod from a real Metro bundle
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm run smoke:bundle
