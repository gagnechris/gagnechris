name: Mobile

# No workflow-level `paths:`: this is a required check, so the job must
# always report. Path filtering happens inside the job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'packages/api-client/**'
              - 'packages/tokens/**'
              - 'packages/app-core/**'
              - 'eslint.config.js'
              - 'tsconfig.base.json'
              - '.github/workflows/mobile.yml'
              - '.github/actions/setup/**'
              - 'package-lock.json'

      - name: Setup
        if: steps.filter.outputs.mobile == 'true'
        uses: ./.github/actions/setup

      # apps/mobile is outside the root workspaces and has its own lockfile, so
      # only this job pays for the Expo / RN tree.
      - name: Install mobile
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile + client packages
        if: steps.filter.outputs.mobile == 'true'
        run: |
          npm run typecheck -w @gagnechris/shared
          npm run typecheck -w @gagnechris/api-client
          npm run typecheck -w @gagnechris/tokens
          npm run typecheck -w @gagnechris/app-core
          npm run typecheck --prefix apps/mobile

      - name: Lint mobile
        if: steps.filter.outputs.mobile == 'true'
        run: npm run lint --prefix apps/mobile

      - name: Test mobile + client packages
        if: steps.filter.outputs.mobile == 'true'
        run: |
          npm test -w @gagnechris/api-client
          npm test -w @gagnechris/tokens
          npm test -w @gagnechris/app-core
          npm test --prefix apps/mobile

      # A successful `expo export` can still bundle `.d.ts` files and crash on
      # launch, so check the sourcemap and execute the bundle too.
      - name: Export iOS bundle
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm run export:ios

      - name: Reject type-only sources in the bundle
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm run check:bundle

      - name: Smoke-run shared Zod from a real Metro bundle
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm run smoke:bundle
