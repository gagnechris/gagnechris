name: Mobile

# No workflow-level `paths:`: this is a required check, so the job must
# always report. Path filtering happens inside the job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'packages/api-client/**'
              - 'packages/tokens/**'
              - 'packages/app-core/**'
              - 'eslint.config.js'
              - 'tsconfig.base.json'
              - '.github/workflows/mobile.yml'
              - '.github/actions/setup/**'
              - 'scripts/ci/mobile-checks.sh'
              - 'package-lock.json'
              - '.nvmrc'
              - '.npmrc'

      - name: Setup
        if: github.event_name == 'push' || steps.filter.outputs.mobile == 'true'
        uses: ./.github/actions/setup
        with:
          npm-cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
          go: 'false'

      # apps/mobile is outside the root workspaces and has its own lockfile, so
      # only the mobile jobs pay for the Expo / RN tree.
      - name: Install mobile
        if: github.event_name == 'push' || steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck, lint, test and check the bundle
        if: github.event_name == 'push' || steps.filter.outputs.mobile == 'true'
        run: bash scripts/ci/mobile-checks.sh
