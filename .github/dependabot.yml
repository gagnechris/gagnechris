version: 2
# Monthly, and no rebase when main moves: each rebase re-runs CI. Strict
# up-to-date PRs need Update branch before merge anyway.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 10
    # Majors that need a deliberate PR (API / engine mismatch), not Dependabot.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: cdk-nag
        update-types: ['version-update:semver-major']
      # React must match the version the Expo SDK pins in apps/mobile (lockfile parity); bump it with the SDK.
      - dependency-name: react
      - dependency-name: react-dom
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        update-types:
          - minor
          - patch

  # Expo pins React Native and its native modules to the SDK, so only security updates open PRs here.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 5
