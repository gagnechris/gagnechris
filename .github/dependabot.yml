version: 2
updates:
  - package-ecosystem: npm
    # Workspace lockfile at the repo root covers apps/web and later packages.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # typescript@7 is the Go rewrite; typescript-eslint still peers <6.1.0.
    # Bump TypeScript majors deliberately, not via Dependabot.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
