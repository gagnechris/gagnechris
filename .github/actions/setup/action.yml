name: Setup
description: Node from .nvmrc, npm cache, and npm ci (run after actions/checkout)
inputs:
  ignore-scripts:
    description: >-
      'true' runs `npm ci --ignore-scripts`, so no dependency install script
      runs. Required in every job with `id-token: write` (CHR-200).
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = 'true' ]; then
          npm ci --ignore-scripts
        else
          npm ci
        fi
