name: Setup
description: Node from .nvmrc, Go from services/api/go.mod (unless go is false), npm and Go caches (no Go cache when go-cache is false), and npm ci (run after actions/checkout)
inputs:
  ignore-scripts:
    description: >-
      'true' runs `npm ci --ignore-scripts`, so no dependency install script
      runs. Required in every job with `id-token: write` or a secret.
    required: false
    default: 'false'
  npm-cache-dependency-path:
    description: >-
      Lockfiles the npm cache key hashes, one per line. A job that installs
      another lockfile's tree (apps/mobile) lists it too, so its cache covers
      that tree.
    required: false
    default: package-lock.json
  go:
    description: "'false' skips Go and its module and build caches."
    required: false
    default: 'true'
  go-cache:
    description: >-
      'false' sets up Go without restoring or saving its module and build
      caches. Required in every job with `id-token: write` or a secret: the
      cache is saved by jobs that run install scripts, and a poisoned build
      cache would end up in the Lambdas synth compiles.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: ${{ inputs.npm-cache-dependency-path }}

    # Go Lambdas are compiled during CDK synth, so every job that synthesizes needs Go.
    - name: Setup Go
      if: inputs.go != 'false'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: services/api/go.mod
        cache: ${{ inputs.go-cache != 'false' }}
        cache-dependency-path: services/api/**/go.sum

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = 'true' ]; then
          npm ci --ignore-scripts
        else
          npm ci
        fi
