name: Setup
description: Node from .nvmrc, Go from go/go.mod, npm and Go caches, and npm ci (run after actions/checkout)
inputs:
  ignore-scripts:
    description: >-
      'true' runs `npm ci --ignore-scripts`, so no dependency install script
      runs. Required in every job with `id-token: write`.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # Go Lambdas are compiled during CDK synth, so every job that synthesizes needs Go.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go/go.mod
        cache-dependency-path: go/**/go.sum

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = 'true' ]; then
          npm ci --ignore-scripts
        else
          npm ci
        fi
