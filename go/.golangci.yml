version: '2'

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # Doc comments only where they say something the name doesn't.
      - linters: [revive]
        text: '^exported: '

formatters:
  enable:
    - gofmt
    - goimports
